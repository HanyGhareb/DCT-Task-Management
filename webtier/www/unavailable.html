<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Service Not Available</title>
<style>
  :root { --brand:#C74634; --ink:#1b2733; --mut:#5b6b7b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:"Segoe UI", Tahoma, Arial, sans-serif; background:#f2f4f7;
    color:var(--ink); min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:24px;
  }
  .card {
    background:#fff; border:1px solid #e1e6ec; border-radius:14px;
    box-shadow:0 10px 30px rgba(27,39,51,.08); max-width:520px; width:100%;
    padding:44px 40px; text-align:center;
  }
  .cube {
    width:56px; height:56px; border-radius:14px; background:var(--brand);
    color:#fff; font-weight:700; font-size:22px; line-height:56px;
    margin:0 auto 20px; letter-spacing:.5px;
  }
  h1 { font-size:20px; margin-bottom:10px; }
  p  { font-size:14.5px; color:var(--mut); line-height:1.65; }
  .ar { direction:rtl; margin-top:18px; padding-top:18px; border-top:1px dashed #e1e6ec; }
  .foot { margin-top:26px; font-size:12px; color:#9aa7b4; }
</style>
</head>
<body>
  <div class="card" role="alert">
    <div class="cube">iF</div>
    <h1>The service is not available</h1>
    <p>Please check with the system administrator.</p>
    <div class="ar">
      <h1>الخدمة غير متوفرة</h1>
      <p>يرجى المراجعة مع مسؤول النظام.</p>
    </div>
    <div class="foot">i-Finance</div>
  </div>
</body>
</html>
