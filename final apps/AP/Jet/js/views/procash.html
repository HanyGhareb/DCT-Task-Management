<div class="page-wrap page-wrap--full">

  <!-- Header: title + actions (top-right) -->
  <div class="page-header-row">
    <div class="page-header">
      <div class="page-title" data-bind="text: $vm.t('pc.title')"></div>
      <div class="page-subtitle" data-bind="text: $vm.t('pc.subtitle')"></div>
    </div>
    <div class="page-actions">
      <button class="btn btn-secondary" data-bind="click: exportCsv, text: $vm.t('pc.exportCsv')"></button>
      <!-- ko if: canCreate -->
      <button class="btn btn-primary" data-bind="click: openNew, text: $vm.t('pc.new')"></button>
      <!-- /ko -->
    </div>
  </div>

  <!-- KPI band -->
  <div class="kpi-row">
    <div class="kpi">
      <div class="kpi-n" data-bind="text: kTotal"></div>
      <div class="kpi-l" data-bind="text: $vm.t('pc.kTransactions')"></div>
    </div>
    <div class="kpi">
      <div class="kpi-n" data-bind="text: kAmount"></div>
      <div class="kpi-l" data-bind="text: $vm.t('pc.kAmountAed')"></div>
    </div>
    <div class="kpi">
      <div class="kpi-n" data-bind="text: kOpen"></div>
      <div class="kpi-l" data-bind="text: $vm.t('pc.kOpen')"></div>
    </div>
    <div class="kpi">
      <div class="kpi-n" data-bind="text: kAwaiting"></div>
      <div class="kpi-l" data-bind="text: $vm.t('pc.kAwaiting')"></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="ap-chips">
    <input class="form-control" style="max-width:300px" type="search"
           data-bind="value: search, valueUpdate: 'input', event: { keyup: onSearchKey },
                      attr: { placeholder: $vm.t('pc.searchPh') }">
    <select class="form-control" style="max-width:190px" data-bind="value: fStatus, event: { change: reload }">
      <option value="" data-bind="text: $vm.t('pc.allStatuses')"></option>
      <!-- ko foreach: statusLov --><option data-bind="value: code, text: label"></option><!-- /ko -->
    </select>
    <select class="form-control" style="max-width:230px" data-bind="value: fBu, event: { change: reload }">
      <option value="" data-bind="text: $vm.t('pc.allBus')"></option>
      <!-- ko foreach: buLov --><option data-bind="value: $data, text: $data"></option><!-- /ko -->
    </select>
    <select class="form-control" style="max-width:200px" data-bind="value: fLinked, event: { change: reload }">
      <option value="" data-bind="text: $vm.t('pc.allInvoice')"></option>
      <option value="N" data-bind="text: $vm.t('pc.notInvoiced')"></option>
      <option value="Y" data-bind="text: $vm.t('pc.invoiced')"></option>
    </select>
    <input class="form-control" style="max-width:150px" type="date"
           data-bind="value: fFrom, event: { change: reload }" aria-label="from">
    <input class="form-control" style="max-width:150px" type="date"
           data-bind="value: fTo, event: { change: reload }" aria-label="to">
    <label class="ap-chip" style="cursor:pointer">
      <input type="checkbox" data-bind="checked: fMine, event: { change: reload }" style="pointer-events:none">
      <span data-bind="text: $vm.t('pc.mineOnly')"></span>
    </label>
    <button class="btn btn-sm btn-secondary" data-bind="click: resetFilters, text: $vm.t('pc.reset')"></button>
  </div>

  <!-- Register -->
  <div class="card ap-region" data-bind="css: { 'ap-region--max': tableMax() }">
    <div class="section-heading-row">
      <div class="section-heading ap-rh">
        <span data-bind="text: $vm.t('pc.register')"></span>
        <span style="font-weight:400;font-size:12px;color:var(--text-2)"
              data-bind="text: ' · ' + total() + ' ' + $vm.t('tbl.rows')"></span>
      </div>
      <div class="region-actions">
        <button class="btn btn-sm btn-secondary" data-bind="click: reload, text: $vm.t('pc.refresh')"></button>
        <button class="btn btn-sm btn-secondary" data-bind="click: toggleTableMax,
                attr: { title: tableMax() ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
      </div>
    </div>

    <!-- ko if: loading() --><list-skeleton params="rows: 8"></list-skeleton><!-- /ko -->
    <!-- ko ifnot: loading() -->
      <!-- ko if: rows().length === 0 -->
      <div class="empty-state" data-bind="text: $vm.t('pc.none')"></div>
      <!-- /ko -->
      <!-- ko if: rows().length > 0 -->
      <div class="data-table-wrap"><table class="data-table">
        <thead><tr>
          <th data-bind="text: $vm.t('pc.paymentNumber')"></th>
          <th data-bind="text: $vm.t('pc.bankReference')"></th>
          <th data-bind="text: $vm.t('pc.payee')"></th>
          <th data-bind="text: $vm.t('pc.businessUnit')"></th>
          <th data-bind="text: $vm.t('pc.paymentDate')"></th>
          <th data-bind="text: $vm.t('pc.currency')"></th>
          <th class="ap-amount" data-bind="text: $vm.t('pc.amount')"></th>
          <th class="ap-amount" data-bind="text: $vm.t('pc.amountAed')"></th>
          <th data-bind="text: $vm.t('pc.status')"></th>
          <th class="ap-amount" data-bind="text: $vm.t('pc.lines')"></th>
          <th data-bind="text: $vm.t('pc.invoiceNumber')"></th>
          <th data-bind="text: $vm.t('pc.createdBy')"></th>
        </tr></thead>
        <tbody><!-- ko foreach: rows -->
          <tr class="ap-row-click" data-bind="click: function () { $vm.openRow($data); }">
            <td data-bind="text: paymentNumber"></td>
            <td data-bind="text: bankReference"></td>
            <td class="ap-clip" data-bind="text: $data.payeeName || $data.supplierName || '',
                                           attr: { title: $data.payeeName || $data.supplierName || '' }"></td>
            <td class="ap-clip" data-bind="text: businessUnit, attr: { title: businessUnit }"></td>
            <td data-bind="text: paymentDate"></td>
            <td data-bind="text: currencyCode"></td>
            <td class="ap-amount" data-bind="text: $vm.num(amount)"></td>
            <td class="ap-amount" data-bind="text: $vm.num(amountAed)"></td>
            <td><span data-bind="text: $vm.statusLabel(status), attr: { class: $vm.pillCls(status) }"></span></td>
            <td class="ap-amount" data-bind="text: lineCount"></td>
            <td>
              <span data-bind="text: $data.invoiceNumber || '—'"></span>
              <!-- ko if: $data.amountMismatch === 'Y' -->
              <span class="pc-pill pc-pill--warn" style="margin-inline-start:6px"
                    data-bind="text: $vm.t('pc.mismatch'), attr: { title: $vm.t('pc.mismatchHint') }"></span>
              <!-- /ko -->
            </td>
            <td class="ap-clip" data-bind="text: $data.createdBy || ''"></td>
          </tr>
        <!-- /ko --></tbody>
      </table></div>
      <list-pager params="total: total, limit: limit, offset: offset, onChange: onPage"></list-pager>
      <!-- /ko -->
    <!-- /ko -->
  </div>

</div>
