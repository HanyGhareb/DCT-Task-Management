<div class="page">
  <div class="page-header-row">
    <h1 class="page-title" data-bind="text: t('atd.runs.title')"></h1>
    <div class="page-actions">
      <button class="btn btn-secondary" data-bind="click: exportCsv, text: t('atd.runs.export')"></button>
    </div>
  </div>

  <div class="card wsum">
    <div class="section-heading-row wsum__head">
      <button type="button" class="wsum__toggle" data-bind="click: toggleWarningGroups,
              attr:{ 'aria-expanded': warningGroupsOpen() ? 'true' : 'false' }">
        <span class="wsum__chev" data-bind="css:{ 'is-open': warningGroupsOpen() }">›</span>
        <span><span class="section-heading" data-bind="text: t('atd.wsum.title')"></span>
          <span class="muted wsum__sub" data-bind="text: t('atd.wsum.subtitle')"></span></span>
      </button>
      <span class="attn__count" data-bind="text: warningGroups().length"></span>
    </div>
    <!-- ko if: warningGroupsOpen -->
    <!-- ko if: warningGroupsLoading --><div class="muted" data-bind="text: t('atd.common.loading')"></div><!-- /ko -->
    <!-- ko if: !warningGroupsLoading() && warningGroups().length === 0 -->
    <div class="empty-state" data-bind="text: t('atd.wsum.empty')"></div>
    <!-- /ko -->
    <!-- ko if: !warningGroupsLoading() && warningGroups().length > 0 -->
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr>
          <th data-bind="text: t('atd.col.job')"></th><th data-bind="text: t('atd.wsum.issue')"></th>
          <th data-bind="text: t('atd.wsum.first')"></th><th data-bind="text: t('atd.wsum.last')"></th>
          <th data-bind="text: t('atd.wsum.runs')"></th><th data-bind="text: t('atd.col.status')"></th>
        </tr></thead>
        <tbody data-bind="foreach: warningGroups">
          <tr class="wsum__row" tabindex="0" data-bind="click: function(){ $vm.openWarningGroup($data); },
              event:{ keydown:function(d,e){ if(e.key==='Enter'||e.key===' '){ $vm.openWarningGroup(d); return false; } return true; } }">
            <td class="mono" data-bind="text: jobName"></td>
            <td><div class="wsum__issue" data-bind="text: issue"></div>
              <!-- ko if: $data.columnName --><div class="muted mono" data-bind="text: $data.columnName"></div><!-- /ko --></td>
            <td data-bind="text: firstSeen"></td><td data-bind="text: lastSeen"></td>
            <td><span class="wsum__runs" data-bind="text: affectedRuns"></span></td>
            <td><span data-bind="css: $vm.statusClass(active==='Y' ? 'WARNING' : 'DONE'),
                text: $root.t(active==='Y' ? 'atd.wsum.active' : 'atd.wsum.resolved')"></span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- /ko -->
    <!-- /ko -->
  </div>

  <div class="view-toolbar">
    <select class="form-control form-control--sm" style="max-width:200px" data-bind="value: fJob">
      <option value="" data-bind="text: t('atd.runs.allJobs')"></option>
      <!-- ko foreach: jobs --><option data-bind="value: $data, text: $data"></option><!-- /ko -->
    </select>
    <select class="form-control form-control--sm" style="max-width:160px" data-bind="value: fStatus">
      <option value="" data-bind="text: t('atd.runs.allStatuses')"></option>
      <!-- ko foreach: statuses --><option data-bind="value: $data, text: $data"></option><!-- /ko -->
    </select>
    <select class="form-control form-control--sm" style="max-width:180px" data-bind="value: fSet">
      <option value="" data-bind="text: t('atd.runs.allSets')"></option>
      <!-- ko foreach: sets --><option data-bind="value: $data.code, text: $data.name"></option><!-- /ko -->
    </select>
    <!-- KO `options` (not foreach-in-select): it applies BEFORE `value`, so a
         drilled/restored VM isn't blanked at bind time while the list loads -->
    <select class="form-control form-control--sm" style="max-width:150px"
            data-bind="options: vms, optionsCaption: t('atd.runs.allVms'), value: fVm"></select>
    <input class="form-control form-control--sm" type="date" style="max-width:150px" data-bind="value: fFrom">
    <input class="form-control form-control--sm" type="date" style="max-width:150px" data-bind="value: fTo">
    <button class="btn btn-sm btn-primary" data-bind="click: search, text: t('atd.filter.search')"></button>
    <button class="btn btn-sm btn-secondary" data-bind="click: clearFilters, text: t('atd.filter.clear')"></button>
    <span class="toolbar-spacer"></span>
    <!-- ko ifnot: loading --><span class="muted" data-bind="text: total() + ' ' + t('atd.common.results')"></span><!-- /ko -->
  </div>

  <!-- ko if: loading --><div class="muted" data-bind="text: t('atd.common.loading')"></div><!-- /ko -->

  <!-- ko ifnot: loading -->
  <!-- ko if: runs().length === 0 --><div class="empty-state" data-bind="text: t('atd.runs.empty')"></div><!-- /ko -->
  <!-- ko if: runs().length > 0 -->
  <div class="data-table-wrap">
    <table class="data-table">
      <thead><tr>
        <th data-bind="text: t('atd.col.run')"></th>
        <th data-bind="text: t('atd.col.job')"></th>
        <th data-bind="text: t('atd.col.jobSet')"></th>
        <th data-bind="text: t('atd.col.host')"></th>
        <th data-bind="text: t('atd.col.track')"></th>
        <th data-bind="text: t('atd.col.status')"></th>
        <th data-bind="text: t('atd.col.rows')"></th>
        <th data-bind="text: t('atd.col.started')"></th>
        <th data-bind="text: t('atd.col.finished')"></th>
        <th data-bind="text: t('atd.col.duration')"></th>
        <th></th>
      </tr></thead>
      <tbody data-bind="foreach: runs">
        <tr style="cursor:pointer" data-bind="click: function(){ $vm.open($data); }">
          <td data-bind="text: $data.runId"></td>
          <td class="mono" data-bind="text: $data.jobName"></td>
          <td>
            <!-- ko if: $data.setCode -->
            <span class="badge" data-bind="text: $data.setCode, attr:{ title: $data.setName || $data.setCode }"></span>
            <!-- /ko -->
            <!-- ko ifnot: $data.setCode --><span class="muted">—</span><!-- /ko -->
          </td>
          <td class="mono" data-bind="text: $data.host || '—'"></td>
          <td data-bind="text: $data.track || '—'"></td>
          <td>
            <span data-bind="css: $vm.statusClass($data.status), text: $vm.statusText($data)"></span>
            <!-- ko if: $data.warn === 'Y' && !$vm.isNoData($data) -->
            <span class="rstat rstat--WARNING" style="margin-inline-start:6px"
                  data-bind="text: $vm.t('atd.runs.warn'), attr:{ title: $data.message }"></span>
            <!-- /ko -->
          </td>
          <td data-bind="text: $data.rowCount"></td>
          <td data-bind="text: $data.started || '—'"></td>
          <td data-bind="text: $data.finished || '—'"></td>
          <td class="mono" data-bind="text: ($data.durationSec != null ? $vm.fmtDuration($data.durationSec) : '—')"></td>
          <!-- Cancel: only a RUNNING row can be cancelled. clickBubble:false or
               the row's own click opens the detail drawer underneath it. -->
          <td>
            <!-- ko if: $data.status === 'RUNNING' -->
            <button class="btn btn-sm btn-danger"
                    data-bind="click: function(){ $vm.cancelRun($data); }, clickBubble: false,
                               attr:{ title: $vm.t('atd.runs.cancelHint') },
                               text: $vm.t('atd.runs.cancel')"></button>
            <!-- /ko -->
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <list-pager params="offset: offset, limit: limit, total: total, onChange: load"></list-pager>
  <!-- /ko -->
  <!-- /ko -->

  <status-legend></status-legend>

  <!-- run detail modal -->
  <!-- ko if: detail -->
  <div class="modal-overlay" data-bind="click: closeDetail">
    <div class="modal-box" data-bind="click: function(){ return true; }, clickBubble: false" style="max-width:1000px">
      <div class="modal-header">
        <h3 data-bind="text: t('atd.runs.detail.title') + ' #' + detail().runId"></h3>
        <div class="region-actions run-actions">
          <button class="btn btn-sm btn-primary" data-bind="click: runAgain, disable: rerunning,
            text: rerunning() ? t('atd.runAction.queueing') : t('atd.runAction.runAgain')"></button>
          <button class="btn btn-sm btn-secondary" data-bind="click: function(){ openJob(false); }, text: t('atd.runAction.openJob')"></button>
          <button class="btn btn-sm btn-secondary" data-bind="click: function(){ openJob(true); }, text: t('atd.runAction.reviewSchema')"></button>
          <button class="btn btn-sm btn-secondary" data-bind="click: copyError, text: t('atd.runAction.copyError')"></button>
          <button class="btn btn-sm btn-secondary" data-bind="click: closeDetail, text: t('atd.action.back')"></button>
        </div>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.col.job')"></label><div class="mono" data-bind="text: detail().jobName"></div></div>
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.col.status')"></label><div><span data-bind="css: statusClass(detail().status), text: statusText(detail())"></span></div></div>
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.col.rows')"></label><div data-bind="text: detail().rowCount"></div></div>
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.detail.checksum')"></label><div class="mono" data-bind="text: detail().csvChecksum || '—'"></div></div>
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.col.started')"></label><div data-bind="text: detail().started || '—'"></div></div>
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.col.finished')"></label><div data-bind="text: detail().finished || '—'"></div></div>
          <div class="form-group"><label class="form-label" data-bind="text: t('atd.col.duration')"></label><div class="mono" data-bind="text: (detail().durationSec != null ? fmtDuration(detail().durationSec) : '—')"></div></div>
          <div class="form-group form-group--full"><label class="form-label" data-bind="text: t('atd.runs.detail.message')"></label>
            <pre class="mono" style="white-space:pre-wrap;margin:0;max-height:240px;overflow:auto" data-bind="text: detail().message || '—'"></pre></div>
        </div>
        <!-- ko if: detail().phases && detail().phases.length -->
        <div class="phase" style="margin-top:20px">
          <h4 class="phase__title" data-bind="text: t('atd.phase.title')"></h4>
          <div class="phase__track" data-bind="foreach: detail().phases">
            <div class="phase__seg" data-bind="style:{ flexGrow: Math.max(Number(durationMs)||0, 100) },
                 attr:{ title: $root.t('atd.phase.'+phaseCode) + ' · ' + $vm.fmtPhase(durationMs) }"></div>
          </div>
          <div class="phase__grid" data-bind="foreach: detail().phases">
            <div class="phase__item"><span class="phase__dot"></span>
              <span class="phase__label" data-bind="text: $root.t('atd.phase.'+phaseCode)"></span>
              <span class="mono phase__time" data-bind="text: $vm.fmtPhase(durationMs)"></span></div>
          </div>
        </div>
        <!-- /ko -->
        <!-- ko if: detail().warnings && detail().warnings.length -->
        <div style="margin-top:20px">
          <h4 style="margin:0 0 6px" data-bind="text: t('atd.runs.detail.dataWarnings')"></h4>
          <p class="muted" style="margin:0 0 10px" data-bind="text: t('atd.runs.detail.dataWarningsHint')"></p>
          <div class="data-table-wrap" style="max-height:260px;overflow:auto">
            <table class="data-table">
              <thead><tr>
                <th data-bind="text: t('atd.runs.detail.row')"></th>
                <th data-bind="text: t('atd.runs.detail.column')"></th>
                <th data-bind="text: t('atd.runs.detail.keys')"></th>
                <th data-bind="text: t('atd.runs.detail.badValue')"></th>
                <th data-bind="text: t('atd.runs.detail.reason')"></th>
                <th data-bind="text: t('atd.runs.detail.sourceRow')"></th>
              </tr></thead>
              <tbody data-bind="foreach: detail().warnings">
                <tr><td data-bind="text: $data.rowNumber"></td><td class="mono" data-bind="text: $data.columnName || '—'"></td>
                  <td><pre class="mono" style="white-space:pre-wrap;margin:0;max-width:260px" data-bind="text: $vm.prettyJson(keyValues)"></pre></td>
                  <td class="mono" data-bind="text: $data.rawValue || '—'"></td><td data-bind="text: $data.reason"></td>
                  <td><details><summary class="link-like" data-bind="text: $root.t('atd.runs.detail.viewRow')"></summary>
                    <pre class="mono" style="white-space:pre-wrap;max-width:420px;max-height:220px;overflow:auto" data-bind="text: $vm.prettyJson(sourceRow)"></pre>
                  </details></td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <!-- /ko -->
      </div>
    </div>
  </div>
  <!-- /ko -->
</div>
