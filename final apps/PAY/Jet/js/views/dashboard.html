<div class="page-wrap page-wrap--full">

  <!-- ── Header: title + actions (top-right) ──────────────────────────── -->
  <div class="page-header-row">
    <div class="page-header">
      <div class="page-title" data-bind="text: $vm.t('dash.title')"></div>
      <div class="page-subtitle" data-bind="text: $vm.t('dash.subtitle')"></div>
    </div>
    <div class="page-actions">
      <button class="btn btn-secondary" data-bind="click: refresh, text: $vm.t('dash.refresh')"></button>
      <button class="btn btn-primary" data-bind="click: function(){ $vm.go('companies'); }, text: $vm.t('co.new')"></button>
    </div>
  </div>

  <!-- ko if: loading() --><list-skeleton params="rows: 6"></list-skeleton><!-- /ko -->
  <!-- ko ifnot: loading() -->

  <!-- ── KPI stat tiles (AP analytics style) ──────────────────────────── -->
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-n" data-bind="text: stats().companies"></div>
      <div class="kpi-l" data-bind="text: $vm.t('kpi.companies')"></div></div>
    <div class="kpi"><div class="kpi-n" data-bind="text: stats().supplierRefs"></div>
      <div class="kpi-l" data-bind="text: $vm.t('kpi.supplierRefs')"></div></div>
    <div class="kpi"><div class="kpi-n kpi-ok" data-bind="text: stats().activeContracts"></div>
      <div class="kpi-l" data-bind="text: $vm.t('kpi.activeContracts')"></div></div>
    <div class="kpi"><div class="kpi-n" data-bind="text: stats().draftContracts"></div>
      <div class="kpi-l" data-bind="text: $vm.t('kpi.draftContracts')"></div></div>
    <div class="kpi"><div class="kpi-n kpi-warn" data-bind="text: stats().expiringContracts"></div>
      <div class="kpi-l" data-bind="text: $vm.t('kpi.expiring')"></div></div>
    <div class="kpi"><div class="kpi-n" data-bind="text: stats().banks"></div>
      <div class="kpi-l" data-bind="text: $vm.t('kpi.banks')"></div></div>
  </div>

  <!-- ── Region — Contracts expiring soon ─────────────────────────────── -->
  <div class="card ap-region" data-bind="css: { 'ap-region--max': regionMax() }">
    <div class="section-heading-row">
      <div class="section-heading ap-rh"><span data-bind="text: $vm.t('rg.expiring')"></span></div>
      <div class="region-actions">
        <button class="btn btn-sm btn-secondary" data-bind="click: toggleRegionMax,
                attr: { title: regionMax() ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
        <button class="btn btn-sm btn-secondary" data-bind="click: toggleRegion,
                attr: { title: regionCollapsed() ? $vm.t('rg.expand') : $vm.t('rg.collapse') },
                text: regionCollapsed() ? '▸' : '▾'"></button>
      </div>
    </div>

    <!-- ko ifnot: regionCollapsed() -->
    <!-- ko if: stats().expiring.length === 0 -->
    <div class="empty-state" data-bind="text: $vm.t('exp.none')"></div>
    <!-- /ko -->
    <!-- ko if: stats().expiring.length > 0 -->
    <div class="data-table-wrap"><table class="data-table">
      <thead><tr>
        <th data-bind="text: $vm.t('exp.contract')"></th>
        <th data-bind="text: $vm.t('exp.company')"></th>
        <th data-bind="text: $vm.t('exp.dateTo')"></th>
        <th class="ap-amount" data-bind="text: $vm.t('exp.daysLeft')"></th>
      </tr></thead>
      <tbody><!-- ko foreach: stats().expiring -->
        <tr class="ap-row-click" data-bind="click: function(){ $vm.openContract($data); }">
          <td data-bind="text: contractNo"></td>
          <td data-bind="text: company"></td>
          <td data-bind="text: dateTo"></td>
          <td class="ap-amount"><span data-bind="text: daysLeft,
              attr: { class: daysLeft <= 15 ? 'badge badge--danger' : 'badge badge--warn' }"></span></td>
        </tr>
      <!-- /ko --></tbody>
    </table></div>
    <!-- /ko -->
    <!-- /ko -->
  </div>

  <!-- /ko -->
</div>
