<div class="page-wrap page-wrap--full">

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <div class="page-header-row">
    <div class="page-header">
      <div class="page-title">
        <span data-bind="text: d() ? (d().nameEn + ' (' + d().code + ')') : $vm.t('cd.title')"></span>
        <!-- ko if: d -->
        <span class="badge" data-bind="text: d().status"></span>
        <!-- /ko -->
      </div>
      <div class="page-subtitle" data-bind="text: $vm.t('cd.subtitle')"></div>
    </div>
    <div class="page-actions">
      <button class="btn btn-secondary btn-sm" data-bind="click: back, text: $vm.t('cd.back')"></button>
    </div>
  </div>

  <!-- ko if: error() --><div class="dw-err" data-bind="text: error"></div><!-- /ko -->
  <!-- ko if: loading --><list-skeleton params="rows: 8"></list-skeleton><!-- /ko -->
  <!-- ko if: !loading() && d() -->
  <!-- ko with: d -->

  <!-- ── KPI band (each tile drills down) ─────────────────────────────── -->
  <div class="pr-kpis">
    <div class="pr-k pr-k--click" data-bind="click: function(){ $vm.drill('emps'); }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kHeadcount')"></div>
      <div class="pr-k-v" data-bind="text: $vm.num(kpis.headcount)"></div></div>
    <div class="pr-k pr-k--click" data-bind="click: function(){ $vm.drill('contracts'); }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kContracts')"></div>
      <div class="pr-k-v" data-bind="text: $vm.num(kpis.activeContracts)"></div></div>
    <div class="pr-k pr-k--click" data-bind="click: function(){ $vm.drill('run'); }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kMonthlyGross')"></div>
      <div class="pr-k-v" data-bind="text: $vm.money($data.latestRun && $data.latestRun.gross)"></div></div>
    <div class="pr-k pr-k--charge pr-k--click" data-bind="click: function(){ $vm.drill('charges'); }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kCharges')"></div>
      <div class="pr-k-v" data-bind="text: $vm.money($data.latestRun && $data.latestRun.charges)"></div></div>
    <div class="pr-k pr-k--click" data-bind="click: function(){ $vm.drill('inv'); }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kInvoices')"></div>
      <div class="pr-k-v" data-bind="text: $vm.num(kpis.invoiceCount)"></div></div>
    <div class="pr-k pr-k--click" data-bind="click: function(){ $vm.drill('inv', 'paid'); }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kTotalPaid')"></div>
      <div class="pr-k-v" data-bind="text: $vm.money(kpis.totalPaid)"></div></div>
    <div class="pr-k pr-k--click" data-bind="click: function(){ $vm.drill('inv', 'out'); },
         css: { 'pr-k--warn': (kpis.outstanding || 0) > 0.005 }">
      <div class="pr-k-l" data-bind="text: $vm.t('cd.kOutstanding')"></div>
      <div class="pr-k-v" data-bind="text: $vm.money(kpis.outstanding)"></div></div>
  </div>
  <div class="pr-note" style="margin:-4px 0 10px" data-bind="text: $vm.t('cd.drillHint')"></div>

  <!-- ── Analytics (charts drill on click) ────────────────────────────── -->
  <div class="card ap-region" data-bind="css: $vm.regCls('charts')">
    <div class="section-heading-row">
      <div class="section-heading ap-rh" data-bind="text: $vm.t('cd.analytics')"></div>
      <div class="region-actions">
        <button class="btn btn-sm btn-secondary" data-bind="click: function(){ $vm.toggleReg('charts'); },
                attr: { title: $vm.regMax() === 'charts' ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
      </div>
    </div>
    <div class="cd-charts">
      <div>
        <div class="cd-ch-t" data-bind="text: $vm.t('cd.paidByCc')"></div>
        <!-- ko if: (paidByCc || []).length --><canvas id="cdPaidCc" height="230" style="cursor:pointer"></canvas><!-- /ko -->
        <!-- ko ifnot: (paidByCc || []).length --><div class="empty-state" data-bind="text: $vm.t('cd.noAp')"></div><!-- /ko -->
      </div>
      <div>
        <div class="cd-ch-t" data-bind="text: $vm.t('cd.apTrend')"></div>
        <!-- ko if: (apTrend || []).length --><canvas id="cdTrend" height="230" style="cursor:pointer"></canvas><!-- /ko -->
        <!-- ko ifnot: (apTrend || []).length --><div class="empty-state" data-bind="text: $vm.t('cd.noAp')"></div><!-- /ko -->
      </div>
      <div>
        <div class="cd-ch-t" data-bind="text: $vm.t('cd.bySector')"></div>
        <canvas id="cdSector" height="230" style="cursor:pointer"></canvas>
      </div>
    </div>
    <!-- ko ifnot: kpis.supplierRefs > 0 -->
    <div class="pr-note" data-bind="text: $vm.t('cd.noSupplierRef')"></div>
    <!-- /ko -->
    <div class="pr-note" data-bind="text: $vm.t('cd.chartDrillHint')"></div>
  </div>

  <!-- ── Latest payroll run + run history ─────────────────────────────── -->
  <div class="card ap-region" data-bind="css: $vm.regCls('payroll')">
    <div class="section-heading-row">
      <div class="section-heading ap-rh" data-bind="text: $vm.t('cd.latestRun')"></div>
      <div class="region-actions">
        <button class="btn btn-secondary btn-sm" data-bind="click: $vm.goRuns, text: $vm.t('cd.openRuns')"></button>
        <button class="btn btn-sm btn-secondary" data-bind="click: function(){ $vm.toggleReg('payroll'); },
                attr: { title: $vm.regMax() === 'payroll' ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
      </div>
    </div>
    <!-- ko if: $data.latestRun && $data.latestRun.period -->
    <div class="dw-form" style="grid-template-columns:repeat(6,minmax(0,1fr))">
      <div class="form-group"><label class="form-label" data-bind="text: $vm.t('cd.period')"></label>
        <div data-bind="text: latestRun.period + ' · ' + latestRun.payroll + ' · ' + latestRun.status"></div></div>
      <div class="form-group"><label class="form-label" data-bind="text: $vm.t('cd.kHeadcount')"></label>
        <div data-bind="text: $vm.num(latestRun.empCount)"></div></div>
      <div class="form-group"><label class="form-label" data-bind="text: $vm.t('cd.gross')"></label>
        <div data-bind="text: $vm.money(latestRun.gross)"></div></div>
      <div class="form-group"><label class="form-label" data-bind="text: $vm.t('cd.net')"></label>
        <div data-bind="text: $vm.money(latestRun.net)"></div></div>
      <div class="form-group"><label class="form-label" data-bind="text: $vm.t('cd.kCharges')"></label>
        <div data-bind="text: $vm.money(latestRun.charges)"></div></div>
      <div class="form-group"><label class="form-label" data-bind="text: $vm.t('cd.paidYtd')"></label>
        <div data-bind="text: $vm.money(kpis.paidYtd)"></div></div>
    </div>
    <!-- /ko -->
    <!-- ko ifnot: $data.latestRun && $data.latestRun.period -->
    <div class="empty-state" data-bind="text: $vm.t('cd.noRun')"></div>
    <!-- /ko -->
    <!-- ko if: $vm.irRuns() -->
    <interactive-report params="reportCode: 'PAY_COMPANY_DASH', section: 'runs',
                                data: $vm.irRuns, isAdmin: false, layoutsApi: null"></interactive-report>
    <!-- /ko -->
  </div>

  <!-- ── Contracts + payroll cost by cost center ──────────────────────── -->
  <div class="pr-2col">
    <div class="card ap-region" data-bind="css: $vm.regCls('contracts')">
      <div class="section-heading-row">
        <div class="section-heading ap-rh" data-bind="text: $vm.t('cd.contracts')"></div>
        <div class="region-actions">
          <button class="btn btn-sm btn-secondary" data-bind="click: function(){ $vm.toggleReg('contracts'); },
                  attr: { title: $vm.regMax() === 'contracts' ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
        </div>
      </div>
      <!-- ko if: $vm.irContracts() -->
      <interactive-report params="reportCode: 'PAY_COMPANY_DASH', section: 'contracts',
                                  data: $vm.irContracts, isAdmin: false, layoutsApi: null"></interactive-report>
      <!-- /ko -->
      <!-- ko ifnot: (contracts || []).length -->
      <div class="empty-state" data-bind="text: $vm.t('cd.noContracts')"></div>
      <!-- /ko -->
    </div>

    <div class="card ap-region" data-bind="css: $vm.regCls('costcc')">
      <div class="section-heading-row">
        <div class="section-heading ap-rh" data-bind="text: $vm.t('cd.costByCc')"></div>
        <div class="region-actions">
          <button class="btn btn-sm btn-secondary" data-bind="click: function(){ $vm.toggleReg('costcc'); },
                  attr: { title: $vm.regMax() === 'costcc' ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
        </div>
      </div>
      <!-- ko if: $vm.irCostCc() -->
      <interactive-report params="reportCode: 'PAY_COMPANY_DASH', section: 'costcc',
                                  data: $vm.irCostCc, isAdmin: false, layoutsApi: null"></interactive-report>
      <!-- /ko -->
      <div class="pr-note" data-bind="text: $vm.t('cd.costByCcNote')"></div>
    </div>
  </div>

  <!-- ── AP invoices ──────────────────────────────────────────────────── -->
  <div class="card ap-region" data-bind="css: $vm.regCls('inv')">
    <div class="section-heading-row">
      <div class="section-heading ap-rh">
        <span data-bind="text: $vm.t('cd.invoices')"></span>
        <span style="font-weight:400;font-size:12px;color:var(--text-2)"
              data-bind="text: $vm.num(kpis.invoiceCount) + ' ' + $vm.t('cd.rows') + ' · ' +
                         $vm.t('cd.invoicedTot') + ' ' + $vm.money(kpis.totalInvoiced) + ' · ' +
                         $vm.t('cd.paid') + ' ' + $vm.money(kpis.totalPaid)"></span>
      </div>
      <div class="region-actions">
        <button class="btn btn-secondary btn-sm" data-bind="click: function(){ $vm.drill('inv'); }, text: $vm.t('cd.viewAll')"></button>
        <button class="btn btn-sm btn-secondary" data-bind="click: function(){ $vm.toggleReg('inv'); },
                attr: { title: $vm.regMax() === 'inv' ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
      </div>
    </div>
    <!-- ko if: $vm.irInvoices() -->
    <interactive-report params="reportCode: 'PAY_COMPANY_DASH', section: 'invoices',
                                data: $vm.irInvoices, isAdmin: false, layoutsApi: null"></interactive-report>
    <!-- /ko -->
    <!-- ko ifnot: (invoices || []).length -->
    <div class="empty-state" data-bind="text: $vm.t('cd.noAp')"></div>
    <!-- /ko -->
    <div class="pr-note" data-bind="text: $vm.t('cd.invoiceNote')"></div>
  </div>

  <!-- ── Employees ────────────────────────────────────────────────────── -->
  <div class="card ap-region" data-bind="css: $vm.regCls('emps')">
    <div class="section-heading-row">
      <div class="section-heading ap-rh">
        <span data-bind="text: $vm.t('cd.employees')"></span>
        <span style="font-weight:400;font-size:12px;color:var(--text-2)"
              data-bind="text: $vm.num(employeesTotal) + ' ' + $vm.t('cd.rows')"></span>
      </div>
      <div class="region-actions">
        <button class="btn btn-secondary btn-sm" data-bind="click: $vm.goEmployees, text: $vm.t('cd.openEmployees')"></button>
        <button class="btn btn-sm btn-secondary" data-bind="click: function(){ $vm.toggleReg('emps'); },
                attr: { title: $vm.regMax() === 'emps' ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
      </div>
    </div>
    <!-- ko if: $vm.irEmps() -->
    <interactive-report params="reportCode: 'PAY_COMPANY_DASH', section: 'emps',
                                data: $vm.irEmps, isAdmin: false, layoutsApi: null"></interactive-report>
    <!-- /ko -->
  </div>

  <!-- /ko -->
  <!-- /ko -->

  <!-- ── Drill-down drawer ────────────────────────────────────────────── -->
  <div class="dw-scrim" data-bind="css: { show: drOpen }, click: closeDr"></div>
  <aside class="dw-drawer" data-bind="css: { show: drOpen, 'dw-full': drMax }" role="dialog" aria-modal="true">
    <header class="dw-h">
      <div>
        <div class="dw-eyebrow" data-bind="text: $vm.t('cd.drill')"></div>
        <div class="dw-title" data-bind="text: drTitle"></div>
      </div>
      <div class="dw-acts">
        <button class="btn btn-secondary btn-sm" data-bind="click: drCsv, enable: drRows().length > 0, text: $vm.t('cd.export')"></button>
        <button class="btn btn-secondary btn-sm" data-bind="click: toggleDrMax,
                attr: { title: drMax() ? $vm.t('rg.restore') : $vm.t('rg.maximize') }">&#10530;</button>
        <button class="btn btn-secondary btn-sm" data-bind="click: closeDr, text: $vm.t('dr.close')"></button>
      </div>
    </header>
    <div class="dw-b">
      <!-- ko if: drTrunc -->
      <div class="dw-hint" data-bind="text: $vm.t('cd.truncNote').replace('{n}', drShown()).replace('{m}', drTotal())"></div>
      <!-- /ko -->
      <!-- ko if: drBusy --><list-skeleton params="rows: 6"></list-skeleton><!-- /ko -->
      <!-- ko ifnot: drBusy -->
      <!-- ko if: drRows().length === 0 -->
      <div class="empty-state" data-bind="text: $vm.t('cd.noRows')"></div>
      <!-- /ko -->
      <!-- ko if: drRows().length > 0 -->
      <div class="data-table-wrap"><table class="data-table">
        <thead><tr data-bind="foreach: drCols">
          <th data-bind="text: label, css: { 'ap-amount': t === 'money' }"></th>
        </tr></thead>
        <tbody data-bind="foreach: drRows">
          <tr data-bind="foreach: $vm.drCols">
            <td data-bind="text: $vm.cellTxt($parentContext.$data, $data),
                           css: { 'ap-amount': t === 'money' }"></td>
          </tr>
        </tbody>
        <tfoot><tr data-bind="foreach: drCols">
          <td style="font-weight:700;border-top:2px solid var(--brand)"
              data-bind="text: $index() === 0 ? ($vm.t('cd.total') + ' (' + $vm.num($vm.drRows().length) + ')')
                              : (t === 'money' && $vm.drSums()[k] !== undefined ? $vm.money($vm.drSums()[k]) : ''),
                         css: { 'ap-amount': t === 'money' }"></td>
        </tr></tfoot>
      </table></div>
      <!-- /ko -->
      <!-- /ko -->
    </div>
  </aside>

</div>
