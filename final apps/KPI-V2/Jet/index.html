<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance KPIs · Fusion i-Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script>window.APP_VERSION = '2.2.4'; /* bump per deploy — drives requirejs urlArgs cache key */</script>
<!-- Shared platform layer — loaded BEFORE app.css so the portal (FPB) styles
     always win; it supplies the base classes the shared components need
     (.data-table/.form-control/.badge/.modal-*/.ir-*/.ed-*). Same pattern as
     the FPB (GL) app — see final apps/GL/Jet/index.html. -->
<link rel="stylesheet" id="platform-css">
<link rel="stylesheet" id="app-css">
<script>
  document.getElementById('platform-css').href = '/shared/css/platform.css?v=' + window.APP_VERSION;
  document.getElementById('app-css').href      = 'css/app.css?v=' + window.APP_VERSION;
</script>
</head>
<body>

<div id="globalBody">
<!-- ═══════════ APP SHELL (FPB portal chrome) ═══════════ -->
<div data-bind="visible: ready" style="display:none">

  <div class="pbar">
    <div class="wordmark home-link" data-bind="click: goHome, attr: {title: t('home')}">
      <span class="mark"><span class="diamond"></span><span data-bind="text: t('appName')"></span></span>
      <span class="sub" data-bind="text: t('appSub')"></span></div>
    <div class="grow"></div>
    <div class="switcher">
      <button class="lang-flip sw-btn" data-bind="click: toggleSwitcher, attr: {title: t('switchApp')}">▦ <span data-bind="text: t('apps')"></span></button>
      <!-- ko if: switcherOpen -->
      <div class="sw-back" data-bind="click: toggleSwitcher"></div>
      <div class="sw-menu">
        <div class="sw-title" data-bind="text: t('switchApp')"></div>
        <!-- ko foreach: modules -->
        <a class="sw-item" data-bind="attr: {href: url}">
          <span class="sw-code" data-bind="style: {background: color}, text: code"></span>
          <span data-bind="text: $root.t(nameKey)"></span>
        </a>
        <!-- /ko -->
      </div>
      <!-- /ko -->
    </div>
    <button class="lang-flip" data-bind="click: toggleLang, text: lang() === 'en' ? 'عربي' : 'English'"></button>
    <div class="who"><div class="av" data-bind="text: userInitials"></div>
      <div><div class="nm" data-bind="text: userName"></div><div class="vn" data-bind="text: t('appSub')"></div></div></div>
    <button class="lang-flip" data-bind="click: signOut, text: t('signOut')"></button>
  </div>

  <nav class="pnav">
    <!-- ko foreach: visibleTabs -->
    <a data-bind="css: {on: $root.currentTab() === id}, click: $root.goTab, text: $root.t(labelKey)"></a>
    <!-- /ko -->
  </nav>

  <div class="wrap" data-bind="module: moduleConfig"></div>

  <div class="pfoot">
    <span data-bind="text: t('footOrg')"></span>
    <span class="grow"></span>
    <span data-bind="text: 'v' + (window.APP_VERSION || '')"></span>
  </div>

</div>
</div>

<script src="https://static.oracle.com/cdn/jet/17.0.0/3rdparty/require/require.js" data-main="js/main"></script>
</body>
</html>
